services:
  postgres:
    image: postgres:16-alpine
    container_name: esquadrias-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-esquadrias}
      POSTGRES_USER: ${POSTGRES_USER:-esquadrias}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-esquadrias_dev_change_me}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - esquadrias_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  esquadrias_pgdata:
